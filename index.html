<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gastromentor">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Gastromentor</title>
<style>
:root{--bg:#000;--bg2:#0d0f13;--card:#14171d;--line:#232831;--fg:#f3f5f8;--mut:#8b94a5;--org:#ff7a2f;--grn:#2fd6a3;--red:#ff4d5e;--blu:#4d8dff;--gry:#6b7385;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:16px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;-webkit-text-size-adjust:100%}
body{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overscroll-behavior-y:none}
.app{max-width:560px;margin:0 auto;min-height:100%;padding-top:calc(env(safe-area-inset-top,0px) + 8px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 86px)}
header{display:flex;align-items:center;gap:12px;padding:6px 0 14px}
header img.gm{width:40px;height:40px;object-fit:contain}
header h1{margin:0;font-size:19px;font-weight:650;letter-spacing:.2px}
header .sub{font-size:12.5px;color:var(--mut)}
header .sp{flex:1;min-width:0}
.ib{appearance:none;border:0;background:var(--card);color:var(--fg);width:40px;height:40px;border-radius:12px;font-size:19px;display:grid;place-items:center}
.ib:active{background:var(--line)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--grn);display:inline-block;margin-right:6px}
.dot.off{background:var(--org)}
.banner{background:#2a1d10;color:#ffb27a;border-radius:12px;padding:9px 12px;font-size:13.5px;margin-bottom:12px}
.banner.err{background:#2a1015;color:#ff9aa4}
section{display:none}
section.on{display:block}
.ringwrap{position:relative;width:min(78vw,300px);margin:6px auto 10px;aspect-ratio:1}
.ringwrap svg{width:100%;height:100%;transform:rotate(-90deg)}
.ringwrap circle{fill:none;stroke-linecap:round}
.rt{stroke:#1a1d24}
.rv{transition:stroke-dashoffset 1.1s cubic-bezier(.3,.7,.2,1)}
.rc{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.rc img{width:58px;height:58px;object-fit:contain;margin:0 auto 4px;opacity:.95}
.rc b{font-size:34px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.rc span{font-size:13px;color:var(--mut);margin-top:3px}
.msg{text-align:center;font-weight:600;margin:0 0 14px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}
.kpi{background:var(--card);border-radius:14px;padding:11px 12px}
.kpi i{display:block;width:22px;height:4px;border-radius:2px;margin-bottom:8px}
.kpi b{display:block;font-size:24px;font-variant-numeric:tabular-nums}
.kpi span{font-size:12.5px;color:var(--mut)}
h2{font-size:13px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;color:var(--mut);margin:20px 2px 10px}
.week{background:var(--card);border-radius:16px;padding:14px 12px 10px}
.bars{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:150px}
.bar{display:flex;flex-direction:column-reverse;gap:2px;align-items:center;justify-content:flex-start;height:100%;position:relative}
.bar .seg{width:100%;max-width:30px;border-radius:4px}
.bar em{position:absolute;left:0;right:0;font-style:normal;font-size:12px;text-align:center;color:var(--fg);font-variant-numeric:tabular-nums}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-top:6px;text-align:center;font-size:12px;color:var(--mut)}
.leg{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:12.5px;color:var(--mut)}
.leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.list{background:var(--card);border-radius:16px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:10px 12px;border-top:1px solid var(--line);min-width:0}
.row:first-child{border-top:0}
.row img.lg{width:44px;height:44px;border-radius:50%;object-fit:cover;flex:none;background:#000}
.row .nm{font-size:16.5px;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .ds{font-size:13px;color:var(--mut)}
.row .tx{flex:1;min-width:0}
.chip{font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;color:#06080b;flex:none}
.tap{cursor:pointer}
.tap:active{background:#1b1f27}
.empty{padding:22px 14px;text-align:center;color:var(--mut);font-size:14.5px}
.pill{font-size:12px;padding:3px 9px;border-radius:999px;background:#1d2128;color:var(--mut);flex:none;font-variant-numeric:tabular-nums}
.ok{color:var(--grn)}
.pe{color:var(--org)}
.er{color:var(--red)}
nav{position:fixed;left:0;right:0;bottom:0;background:rgba(10,12,16,.92);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-top:1px solid var(--line);display:flex;padding:6px max(12px,env(safe-area-inset-left,0px)) calc(env(safe-area-inset-bottom,0px) + 4px) max(12px,env(safe-area-inset-right,0px));z-index:5}
nav button{flex:1;appearance:none;border:0;background:none;color:var(--mut);padding:6px 0;font:inherit;font-size:11.5px;display:flex;flex-direction:column;align-items:center;gap:3px}
nav button svg{width:25px;height:25px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--fg)}
nav button.on svg{stroke:var(--blu)}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;z-index:20}
.sheet.on{display:flex}
.sheet .in{background:var(--bg2);width:100%;max-width:560px;margin:0 auto;border-radius:22px 22px 0 0;max-height:88%;overflow:auto;padding:16px 16px calc(env(safe-area-inset-bottom,0px) + 18px);border:1px solid var(--line);border-bottom:0}
.sheet h3{margin:0 0 4px;font-size:20px}
.sheet p{margin:4px 0 12px;color:var(--mut);font-size:14px}
.sheet input{width:100%;font-size:17px;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:#000;color:var(--fg)}
.btn{appearance:none;border:0;border-radius:13px;background:var(--blu);color:#fff;font-size:17px;font-weight:600;padding:13px;width:100%;margin-top:12px}
.btn.sec{background:var(--card);color:var(--fg)}
.hd{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.hd img{width:52px;height:52px;border-radius:50%;object-fit:cover}
.cnt{font-size:13.5px;color:var(--mut);margin:0 2px 10px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px 8px}
.gi{display:flex;flex-direction:column;align-items:center;text-align:center;gap:7px;min-width:0;cursor:pointer}
.gi:active{opacity:.7}
.gi .lw{position:relative;width:min(25vw,100px);aspect-ratio:1}
.gi svg{position:absolute;inset:-6px;width:calc(100% + 12px);height:calc(100% + 12px);transform:rotate(-90deg)}
.gi svg circle{fill:none;stroke-width:4;stroke-linecap:round}
.gi img{width:100%;height:100%;border-radius:50%;object-fit:cover;background:#000;display:block}
.gi b{font-size:13px;font-weight:600;line-height:1.15;max-width:100%}
.gi span{font-size:11.5px;color:var(--mut);min-height:14px}
.pc{background:var(--card);border-radius:16px;padding:14px;margin-bottom:12px}
.pc .ph{display:flex;align-items:center;gap:12px;min-width:0}
.pc img.lg{width:46px;height:46px;border-radius:50%;object-fit:cover;flex:none;background:#000}
.pc .tx{flex:1;min-width:0}
.pc .nm{font-size:17px;font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pc .ds{font-size:13px;color:var(--mut)}
.pc .copy{margin:12px 0 8px;font-size:16px;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere}
.pc .meta{font-size:12.5px;color:var(--mut);overflow-wrap:anywhere}
.pc .tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:999px;background:#2a1d10;color:#ffb27a;margin-bottom:2px}
.acts{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:8px;margin-top:12px}
.acts button{appearance:none;border:0;border-radius:12px;padding:12px 6px;font:inherit;font-size:15.5px;font-weight:650}
.acts .ok{background:var(--grn);color:#04130e}
.acts .no{background:#2a1015;color:#ff9aa4}
.acts .ed{background:#1d2128;color:var(--fg)}
.acts button.arm{outline:2px solid var(--fg)}
.acts button:disabled{opacity:.45}
.pc textarea{width:100%;min-height:130px;margin-top:12px;font:inherit;font-size:16px;line-height:1.4;padding:12px;border-radius:12px;border:1px solid var(--line);background:#000;color:var(--fg);resize:vertical}
.pc .sv{margin-top:8px;width:100%;appearance:none;border:0;border-radius:12px;padding:12px;font:inherit;font-weight:650;background:var(--blu);color:#fff}
.bd{position:absolute;top:2px;left:calc(50% + 6px);min-width:18px;height:18px;border-radius:9px;background:var(--red);color:#fff;font-size:11.5px;font-weight:700;display:grid;place-items:center;padding:0 5px}
nav button{position:relative}
@media (prefers-reduced-motion:reduce){.rv{transition:none}}
</style>
</head>
<body>
<div class="app">
  <header>
    <img class="gm" src="logo-gm.png" alt="Gastromentor">
    <div class="sp"><h1>Gastromentor</h1><div class="sub" id="sub"><span class="dot off"></span>Cargando…</div></div>
    <button class="ib" id="bref" aria-label="Actualizar">&#8635;</button>
    <button class="ib" id="bset" aria-label="Ajustes">&#9881;</button>
  </header>
  <div id="ban"></div>

  <section id="s-res" class="on">
    <div class="ringwrap">
      <svg viewBox="0 0 220 220">
        <circle class="rt" cx="110" cy="110" r="100" stroke-width="15"/><circle class="rv" id="r0" cx="110" cy="110" r="100" stroke-width="15" stroke="var(--org)"/>
        <circle class="rt" cx="110" cy="110" r="80" stroke-width="15"/><circle class="rv" id="r1" cx="110" cy="110" r="80" stroke-width="15" stroke="var(--grn)"/>
        <circle class="rt" cx="110" cy="110" r="60" stroke-width="15"/><circle class="rv" id="r2" cx="110" cy="110" r="60" stroke-width="15" stroke="var(--red)"/>
      </svg>
      <div class="rc"><img src="logo-gm.png" alt=""><b id="big">–</b><span>programadas de 38</span></div>
    </div>
    <p class="msg" id="msg"></p>
    <div class="kpis">
      <div class="kpi"><i style="background:var(--org)"></i><b id="k0">–</b><span>Programadas</span></div>
      <div class="kpi"><i style="background:var(--grn)"></i><b id="k1">–</b><span>Publicadas</span></div>
      <div class="kpi"><i style="background:var(--red)"></i><b id="k2">–</b><span>Fallos</span></div>
    </div>
    <h2 id="wk">Esta semana</h2>
    <div class="week">
      <div class="bars" id="bars"></div>
      <div class="days" id="days"></div>
      <div class="leg"><span><i style="background:var(--blu)"></i>Historias</span><span><i style="background:var(--grn)"></i>Reels</span><span><i style="background:var(--red)"></i>Carruseles</span></div>
    </div>
    <div id="fall"></div>
    <h2>Próximas programadas</h2>
    <div class="list" id="prox"></div>
  </section>

  <section id="s-rest">
    <div class="cnt" id="rcnt"></div>
    <div class="grid" id="rlist"></div>
  </section>

  <section id="s-apr">
    <div class="cnt" id="acnt"></div>
    <div id="alist"></div>
  </section>

  <section id="s-hoy">
    <div class="cnt" id="hcnt"></div>
    <div class="list" id="hlist"></div>
  </section>
</div>

<nav>
  <button data-t="res" class="on"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/></svg>Resumen</button>
  <button data-t="rest"><svg viewBox="0 0 24 24"><path d="M4 11h16M5 11l1 9h12l1-9M8 11V7a4 4 0 0 1 8 0v4"/></svg>Restaurantes</button>
  <button data-t="apr"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.7 2.7L16 9.5"/></svg>Aprobar<span class="bd" id="abd" hidden></span></button>
  <button data-t="hoy"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>Hoy</button>
</nav>

<div class="sheet" id="sh"><div class="in" id="shin"></div></div>

var $=function(i){return document.getElementById(i)};
var data=null,stamp=0,online=true,loading=false;
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v)}catch(e){return null}}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function nk(s){return String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z0-9]/g,"")}
function tipo(t){t=String(t||"").toLowerCase();return t.indexOf("hist")>=0||t.indexOf("stor")>=0?"Historia":t.indexOf("reel")>=0?"Reel":t.indexOf("carr")>=0?"Carrusel":"Otro"}
function tname(t){var x=tipo(t);return x==="Otro"?(t||"Post"):x}
function logoFor(name){var k=nk(name);if(/^rafaelgarcia/.test(k))k="verdelimon";if(!k)return null;var i;for(i=0;i<LOGOS.length;i++)if(LOGOS[i].k===k)return LOGOS[i];var best=null;for(i=0;i<LOGOS.length;i++){var l=LOGOS[i].k;if(k.indexOf(l)>=0||l.indexOf(k)>=0){if(!best||l.length>best.k.length)best=LOGOS[i]}}return best}
function pdate(d){var m=/^(\d+)\/(\d+)\/(\d+)/.exec(d||"");return m?new Date(2000+ +m[3],+m[2]-1,+m[1]):null}
function postsOf(L){var out=[];(data.rest||[]).forEach(function(r){var rk=nk(r.n);if(/^rafaelgarcia/.test(rk))rk="verdelimon";if(!rk)return;var m=rk===L.k;if(!m&&(rk.indexOf(L.k)>=0||L.k.indexOf(rk)>=0)){m=true;for(var j=0;j<LOGOS.length;j++){if(LOGOS[j].k!==L.k&&LOGOS[j].k===rk){m=false;break}}}if(m)(r.p||[]).forEach(function(p){out.push(p)})});out.sort(function(a,b){var x=pdate(a.d),y=pdate(b.d);return (x?x.getTime():0)-(y?y.getTime():0)});return out}

  // hoy
  var hp=data.hoy_pub||[];$("hcnt").textContent=hp.length?(hp.length+(hp.length===1?" publicada hoy":" publicadas hoy")):"";
  $("hlist").innerHTML=hp.length?hp.map(function(x){var L=logoFor(x.r),ty=tipo(x.t);return '<div class="row">'+(L?'<img class="lg" src="'+L.i+'" alt="">':'<div class="lg"></div>')+'<div class="tx"><div class="nm">'+esc(L?L.n:x.r)+'</div></div><span class="chip" style="background:'+COL[ty]+'">'+esc(tname(x.t))+'</span></div>'}).join(""):'<div class="empty">Hoy aún no hay nada publicado</div>';
  renderRest();
  status();
}
function renderRest(){var anyd=!!(data&&data.rest),C=2*Math.PI*46,rows="";
  function arc(f,col){f=Math.max(0,Math.min(1,f));return f>0?'<circle cx="50" cy="50" r="46" stroke="'+col+'" stroke-dasharray="'+(C*f)+' '+C+'"/>':""}
  LOGOS.forEach(function(L,i){var ps=anyd?postsOf(L):[],np=0,nok=0;ps.forEach(function(p){if(tipo(p.t)==="Historia")return;np++;if(p.ok)nok++});
    rows+='<div class="gi" data-i="'+i+'"><div class="lw"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" stroke="#1a1d24"/>'+arc(np/2,"#ff7a2f")+arc(nok/2,"#2fd6a3")+'</svg><img src="'+L.i+'" alt=""></div><b>'+esc(L.n)+'</b><span>'+(anyd?(nok+" de "+np+" publicadas"):"")+'</span></div>'});
  $("rlist").innerHTML=rows;$("rcnt").textContent=anyd?"Toca un restaurante para ver su semana":"Toca un restaurante · conecta para ver sus datos"}
function getTok(){var v=ls("gm_token");if(v)return v;try{var m=document.cookie.match(/(?:^|; )gm_token=([^;]*)/);if(m){v=decodeURIComponent(m[1]);ls("gm_token",v);return v}}catch(e){}return null}
function setTok(v){ls("gm_token",v);try{document.cookie="gm_token="+encodeURIComponent(v)+"; max-age=31536000; path=/; Secure; SameSite=Strict"}catch(e){}try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}}
function status(){var s=$("sub");if(!data){return}
  s.innerHTML='<span class="dot'+(online?'':' off')+'"></span>'+(online?"Actualizado ":"Sin conexión · datos de ")+hm(stamp)}
function banner(t,err){$("ban").innerHTML=t?'<div class="banner'+(err?' err':'')+'">'+esc(t)+'</div>':""}

function load(){
  if(loading)return;var tk=getTok();if(!tk){openSet(true);return}
  loading=true;$("bref").style.opacity=".5";
  var ctl=window.AbortController?new AbortController():null,to=setTimeout(function(){ctl&&ctl.abort()},20000);
  fetch(API,{headers:{"X-Hermes-Token":tk},signal:ctl?ctl.signal:undefined}).then(function(r){
    if(r.status===401||r.status===403){throw {auth:1}}
    if(!r.ok)throw new Error("http "+r.status);return r.json()}).then(function(j){
    if(!j||!j.data)throw new Error("sin datos");data=j.data;stamp=Date.now();online=true;loadPend();ls("gm_cache",JSON.stringify({t:stamp,d:data}));banner("");render()
  }).catch(function(e){
    if(e&&e.auth){banner("La clave no es correcta. Revísala en Ajustes.",true);openSet(true);return}
    online=false;if(data){banner("Sin conexión. Se muestran los últimos datos guardados.");status()}else banner("No se pueden cargar los datos. Comprueba la conexión.",true)
  }).then(function(){clearTimeout(to);loading=false;$("bref").style.opacity=""});
}


var pend=[],pendOk=false,sent={},armed=null;
function sentKey(r,a){return r+":"+a}
function fcount(f){var s=String(f||"").trim();if(!s)return 0;return s.split(/[\n,;|]+/).filter(function(x){return x.trim()}).length}
function fnames(f){var a=String(f||"").split(/[\n,;|]+/).map(function(x){return x.trim()}).filter(Boolean);var n=a.filter(function(x){return /\.[a-z0-9]{2,4}$/i.test(x)});return n.slice(0,4).join(" · ")}
function renderPend(){
  var now=Date.now(),items=pend.filter(function(p){var s=sent[sentKey(p.row,"ok")]||sent[sentKey(p.row,"no")];return !(s&&now-s<90000)});
  var bd=$("abd");bd.hidden=!items.length;bd.textContent=items.length;
  $("acnt").textContent=!pendOk?"No se pudieron cargar las piezas pendientes":(items.length?(items.length+(items.length===1?" pieza pendiente de aprobar":" piezas pendientes de aprobar")):"");
  if(!items.length){$("alist").innerHTML='<div class="list"><div class="empty">'+(pendOk?"No hay nada pendiente de aprobar":"Sin datos todavía")+'</div></div>';return}
  var tx=document.activeElement&&document.activeElement.tagName==="TEXTAREA";if(tx)return;
  $("alist").innerHTML=items.map(function(p){var L=logoFor(p.r),ty=tipo(p.t),nf=fcount(p.f),names=fnames(p.f);
    return '<div class="pc" data-row="'+p.row+'"><div class="ph">'+(L?'<img class="lg" src="'+L.i+'" alt="">':'')+'<div class="tx"><div class="nm">'+esc(L?L.n:p.r)+'</div><div class="ds">'+esc(p.d)+' · '+esc(p.h)+' · '+esc(p.p||"Instagram")+'</div></div><span class="chip" style="background:'+COL[ty]+'">'+esc(tname(p.t))+'</span></div>'
    +(p.e==="revisar_copy"?'<div class="copy" style="margin-bottom:0"><span class="tag">Para revisar</span></div>':'')
    +'<div class="copy">'+(p.c?esc(p.c):'<span style="color:var(--mut)">Sin texto todavía</span>')+'</div>'
    +'<div class="meta">'+(nf?(nf+(nf===1?" archivo":" archivos")+(names?" · "+esc(names):"")):"Sin archivos indicados")+(p.n?' · Nota: '+esc(p.n):'')+' · Fila '+p.row+'</div>'
    +'<div class="acts"><button class="ok" data-a="ok">Aprobar</button><button class="no" data-a="no">Rechazar</button><button class="ed" data-a="ed">Escribir</button></div></div>'}).join("")}
function loadPend(){var tk=getTok();if(!tk)return;
  fetch(PEND,{headers:{"X-Hermes-Token":tk}}).then(function(r){if(!r.ok)throw new Error("http "+r.status);return r.json()}).then(function(j){pend=(j&&j.data&&j.data.pend)||[];pendOk=true;renderPend()}).catch(function(){pendOk=false;renderPend()})}
function decide(row,acc,texto,btn){var tk=getTok();var k=sentKey(row,acc);if(sent[k]&&Date.now()-sent[k]<90000)return;sent[k]=Date.now();
  if(btn){btn.disabled=true;btn.textContent="Enviando…"}
  fetch(DECIDE,{method:"POST",headers:{"X-Hermes-Token":tk,"content-type":"application/json"},body:JSON.stringify({web:1,accion:acc,row:row,texto:texto||""})}).then(function(r){if(!r.ok)throw new Error("http "+r.status);
    banner(acc==="ok"?"Aprobada. Se está programando en Postiz.":acc==="no"?"Rechazada. Se está generando otro texto.":"Texto guardado. Revisa y aprueba cuando quieras.");
    renderPend();setTimeout(loadPend,6000);setTimeout(loadPend,20000)}).catch(function(){delete sent[k];banner("No se pudo enviar. Inténtalo de nuevo.",true);renderPend()})}
$("alist").onclick=function(e){var b=e.target.closest("button");if(!b)return;var c=b.closest(".pc"),row=+c.dataset.row,a=b.dataset.a;
  if(b.classList.contains("sv")){var ta=c.querySelector("textarea");var v=ta.value.trim();if(!v)return;decide(row,"texto",v,b);return}
  if(a==="ed"){var ex=c.querySelector("textarea");if(ex){ex.parentNode.removeChild(ex);var s0=c.querySelector(".sv");if(s0)s0.parentNode.removeChild(s0);return}
    var p=pend.filter(function(x){return x.row===row})[0]||{};var ta2=document.createElement("textarea");ta2.value=p.c||"";var sv=document.createElement("button");sv.className="sv";sv.textContent="Guardar mi texto";c.appendChild(ta2);c.appendChild(sv);ta2.focus();return}
  if(a==="ok"||a==="no"){var key=row+":"+a;if(armed&&armed.key===key){clearTimeout(armed.t);armed=null;decide(row,a,"",b);return}
    if(armed){clearTimeout(armed.t);armed.b.textContent=armed.b.dataset.a==="ok"?"Aprobar":"Rechazar";armed.b.classList.remove("arm")}
    b.textContent="¿Seguro?";b.classList.add("arm");armed={key:key,b:b,t:setTimeout(function(){b.textContent=a==="ok"?"Aprobar":"Rechazar";b.classList.remove("arm");armed=null},4000)}}};
function sheet(html){$("shin").innerHTML=html;$("sh").classList.add("on")}
function closeSheet(){$("sh").classList.remove("on")}
function openSet(first){
  sheet('<h3>'+(first?'Clave de acceso':'Ajustes')+'</h3><p>'+(first?'Escribe la clave de tu sistema. Se guarda solo en este teléfono.':'Cambia la clave de acceso guardada en este teléfono.')+'</p><input id="tk" type="password" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Clave" value="'+esc(getTok()||"")+'"><button class="btn" id="tks">Guardar</button>'+(first?'':'<button class="btn sec" id="tkc">Cerrar</button>'));
  $("tks").onclick=function(){var v=$("tk").value.trim();if(!v)return;setTok(v);closeSheet();load()};
  if($("tkc"))$("tkc").onclick=closeSheet;
}
function openRest(i){var L=LOGOS[i],ps=postsOf(L);
  var h='<div class="hd"><img src="'+L.i+'" alt=""><div><h3>'+esc(L.n)+'</h3><div class="ds" style="color:var(--mut);font-size:13.5px">Esta semana</div></div></div>';
  if(!ps.length)h+='<div class="empty">Sin publicaciones esta semana</div>';
  else h+='<div class="list">'+ps.map(function(p){var d=pdate(p.d),ty=tipo(p.t);var dn=d?DIAS[(d.getDay()+6)%7]+" "+("0"+d.getDate()).slice(-2)+"/"+("0"+(d.getMonth()+1)).slice(-2):esc(p.d);
    return '<div class="row"><div class="tx"><div class="nm">'+dn+'</div><div class="ds '+(p.ok?'ok':'pe')+'">'+(p.ok?'Publicado':'Programado')+'</div></div><span class="chip" style="background:'+COL[ty]+'">'+esc(tname(p.t))+'</span></div>'}).join("")+'</div>';
  h+='<button class="btn sec" id="shc">Cerrar</button>';sheet(h);$("shc").onclick=closeSheet}

document.querySelectorAll("nav button").forEach(function(b){b.onclick=function(){document.querySelectorAll("nav button").forEach(function(x){x.classList.toggle("on",x===b)});["res","rest","apr","hoy"].forEach(function(t){$("s-"+t).classList.toggle("on",t===b.dataset.t)});window.scrollTo(0,0);if(b.dataset.t==="res"&&data)render();if(b.dataset.t==="apr")loadPend()}});
$("rlist").onclick=function(e){var r=e.target.closest(".gi");if(r)openRest(+r.dataset.i)};
$("sh").onclick=function(e){if(e.target===$("sh"))closeSheet()};
$("bref").onclick=load;$("bset").onclick=function(){openSet(false)};
document.addEventListener("visibilitychange",function(){if(!document.hidden&&Date.now()-stamp>30000)load()});
setInterval(function(){if(!document.hidden)load()},60000);
ring("r0",0);ring("r1",0);ring("r2",0);renderRest();
try{var c=JSON.parse(ls("gm_cache")||"null");if(c&&c.d){data=c.d;stamp=c.t;online=false;render()}}catch(e){}
load();
if("serviceWorker" in navigator&&location.protocol==="https:"){navigator.serviceWorker.register("sw.js").catch(function(){})}
})();
</script>
